aid: branchtrack
name: Branchtrack
description: >-
  BranchTrack is a browser-based authoring platform for building interactive branching
  scenarios and conversation simulations used in corporate learning and development. Instructional
  designers and L&D teams create decision-tree simulations with no coding or design skills,
  then deploy them inside existing LMS platforms or embed them into courses authored in
  Articulate Storyline, Rise, Adobe Captivate, Gomo, and Lectora. Simulations export as SCORM
  and xAPI (Tin Can) packages and can be shared as responsive, mobile-native experiences with
  learner analytics and completion tracking. BranchTrack is a portfolio company of Seedcamp.
  The platform exposes no first-party developer API, SDK, or developer portal; third-party
  embedding is available via the Embedly oEmbed provider, and LMS delivery via SCORM/xAPI.
